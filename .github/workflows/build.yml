name: Build Android (汉化版)

# 触发编译：修改任意非 md/docs 文件并推送到 main，或在 Actions 页面手动 Run workflow
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '*LICENSE'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  ANDROID_NDK_VERSION: "29.0.14206865"
  # 签名密钥存放在 GitHub Secret ANDROID_KEYSTORE_B64，密码在 ANDROID_KEYSTORE_PASSWORD，
  # 别名在 ANDROID_KEYSTORE_ALIAS。密钥绝不能再提交进仓库。
  #
  # 下面这个指纹是公开信息，用来在 CI 里硬校验签名密钥。
  # 一旦产出包的证书和它对不上，构建必须失败——绝不允许静默换密钥，
  # 否则所有已安装用户都会收到"签名不一致"而无法升级。
  EXPECTED_CERT_SHA256: "603f9fa9bf2078dcdf1b2429e4c928f3bf22ba6edbecabe1fa19c8e7b24b4c0b"
  BUILD_TOOLS_VERSION: "36.1.0"

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # 确保 vcpkg 根目录固定，避免环境变量被覆盖
      - name: Override VCPKG_ROOT
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        run: |
          choco install ninja
          vcpkg install freetype:x64-windows zstd:x64-windows

      - name: Configure and build (MSVC)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (
            echo Visual Studio with C++ workload not found
            exit /b 1
          )
          call "%VSPATH%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          cmake --preset x-windows-ci-msvc
          cmake --build --preset x-windows-ci-msvc

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Dusklight-zh-win32-x86_64
          path: |
            build/install/*.exe
            build/install/*.dll
            build/install/res/
            build/install/mods/
            build/install/sdk/

  build-linux:
    name: Build Linux x86_64 (Steam Deck)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang lld mold openssl libcurl4-openssl-dev \
            zlib1g-dev libglu1-mesa-dev libdbus-1-dev libvulkan-dev libxi-dev libxrandr-dev libasound2-dev \
            libpulse-dev libudev-dev libpng-dev libncurses5-dev libx11-xcb-dev libfreetype-dev \
            libxinerama-dev libxcursor-dev python3-markupsafe libgtk-3-dev libssl-dev \
            libxss-dev libfuse2 libusb-1.0-0-dev libdecor-0-dev libpipewire-0.3-dev libunwind-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset x-linux-ci-gcc

      - name: Build
        run: cmake --build --preset x-linux-ci-gcc

      - name: Generate AppImage
        run: ci/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Dusklight-zh-linux-x86_64
          path: |
            build/install/Dusklight-*.AppImage

  build-android:
    name: Build Android arm64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable
          rustup target add aarch64-linux-android

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset x-android-ci-arm64

      - name: Build native library
        run: cmake --build --preset x-android-ci-arm64 --target dusklight

      - name: Build bundled mods
        run: cmake --build --preset x-android-ci-arm64 --target dusklight_mods

      - name: Build APK
        working-directory: platforms/android
        run: ./gradlew :app:assembleRelease --rerun-tasks

      - name: Prepare keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          # 只接受 GitHub Secret 里的密钥。密钥缺失就直接失败。
          # 绝对不要在这里"没有就生成一把新的"——那样产出的 APK
          # 和线上已发布版本的签名不同，所有已安装用户都会无法升级，
          # 而且构建不会报错，问题会被埋到用户点安装那一刻才暴露。
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::缺少 Secret ANDROID_KEYSTORE_B64，无法签名。"
            echo "请在仓库 Settings -> Secrets and variables -> Actions 里添加它"
            echo "（值 = 现有 release.keystore 的 base64）。"
            exit 1
          fi
          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEYSTORE_ALIAS:-}" ]; then
            echo "::error::缺少 Secret ANDROID_KEYSTORE_PASSWORD 或 ANDROID_KEYSTORE_ALIAS。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.keystore
          keytool -list -v -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" > /dev/null
          echo "Keystore restored from secret; alias '$KEYSTORE_ALIAS' is present."

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          UNSIGNED=$(ls platforms/android/app/build/outputs/apk/release/app-*-release-unsigned.apk)
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          # v1/v2/v3 全部显式开启。
          # 之前只开 v3（因为 minSdk=28，apksigner 会自动关掉 v1/v2），
          # 部分第三方安装器解析这种只带 v3 的包时会报
          # INSTALL_PARSE_FAILED_NO_CERTIFICATES。
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 21 \
            --out Dusklight-CN-signed.apk \
            aligned.apk

      - name: Verify signature and pin the certificate
        shell: bash
        # 注意：不要在这里写 env: EXPECTED_CERT_SHA256: $EXPECTED_CERT_SHA256。
        # step 级 env 块不会继承/解析 workflow 级 env 的引用，会被当成字面量。
        # 直接继承顶层 env 即可。
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          "$BUILD_TOOLS/apksigner" verify --min-sdk-version 21 --verbose \
            --print-certs Dusklight-CN-signed.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 Dusklight-CN-signed.apk

          # 去掉 head 的管道，避免 grep 收到 SIGPIPE 在 pipefail 下让整步失败。
          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs Dusklight-CN-signed.apk \
            | grep -oE '[0-9a-f]{64}')
          ACTUAL=$(printf '%s\n' "$CERTS" | sed -n '1p')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr 'A-Z' 'a-z')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名证书与预期不符，拒绝发布。"
            echo "预期: $EXPECTED"
            echo "实际: ${ACTUAL:-<未取到>}"
            echo "发布这个包会导致所有已安装用户无法覆盖升级。"
            exit 1
          fi
          echo "证书指纹校验通过: $ACTUAL"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Dusklight-zh-android-arm64
          path: Dusklight-CN-signed.apk

  publish-release:
    name: 发布汉化版 Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 读取汉化版版本号
        id: version
        run: |
          VERSION=$(python3 -c "import json; d=json.load(open('CMakePresets.json')); print(next(p['cacheVariables']['BOREALIS_APP_VERSION_OVERRIDE'] for p in d['configurePresets'] if p['name']=='x-android-ci'))")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-zh" >> "$GITHUB_OUTPUT"

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v7
        with:
          name: Dusklight-zh-win32-x86_64
          path: dist/windows

      - name: 下载 Linux 产物
        uses: actions/download-artifact@v7
        with:
          name: Dusklight-zh-linux-x86_64
          path: dist/linux

      - name: 下载 Android 产物
        uses: actions/download-artifact@v7
        with:
          name: Dusklight-zh-android-arm64
          path: dist/android

      - name: 整理发布文件
        # 资源文件名必须是纯 ASCII。GitHub 在上传 release 资源时会把
        # 文件名里的非 ASCII 字符替换成 "."，之前 "Dusklight-汉化版-*.apk"
        # 实际存成了 "Dusklight-.-*.apk"，很难看也不好认。
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="${{ steps.version.outputs.version }}"
          cp dist/android/Dusklight-CN-signed.apk "release/Dusklight-zh-v${VERSION}-android-arm64.apk"
          APPIMAGE=$(ls dist/linux/Dusklight-*.AppImage | head -n1)
          cp "$APPIMAGE" "release/Dusklight-zh-v${VERSION}-linux-x86_64.AppImage"
          (cd dist/windows && zip -qr "../../release/Dusklight-zh-v${VERSION}-windows-x86_64.zip" .)
          ls -lh release

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="Dusklight 汉化版 v${VERSION}（基于上游 v${VERSION}）。

          - Windows x86_64：解压 zip 后运行 dusklight.exe
          - Linux x86_64：AppImage 需先赋予执行权限（chmod +x）
          - Android arm64：APK 与旧版汉化版同签名，可直接覆盖安装。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "更新已有 Release：${TAG}"
            gh release view "$TAG" --json assets --jq '.assets[].name' > old-assets.txt || true
            gh release upload "$TAG" release/* --clobber
            # 清掉历史上用旧命名规则留下的资源，避免同一个 tag 下
            # 同时存在 "Dusklight-.-*" 和 "Dusklight-zh-*" 两套文件名。
            while read -r old; do
              case "$old" in
                Dusklight-zh-*) continue ;;
              esac
              echo "删除旧资源: $old"
              gh release delete-asset "$TAG" "$old" --yes || true
            done < old-assets.txt
          else
            echo "创建 Release：${TAG}"
            gh release create "$TAG" release/* \
              --title "Dusklight 汉化版 v${VERSION}" \
              --notes "$NOTES" || {
                echo "创建失败（标签可能已存在），尝试仅上传资产"
                gh release upload "$TAG" release/* --clobber
              }
          fi
